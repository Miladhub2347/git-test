name: Mehrstufiger Ablauf

on:
  push:
    branches:
      - rebase-test

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt klonen
        uses: actions/checkout@v4

      - name: Prüfe auf hallo.txt
        run: |
          if [ ! -f hallo.txt ]; then
            echo "Datei fehlt!" && exit 1
          fi
          echo "Datei gefunden."

  run-tests:
    needs: check-code
    runs-on: ubuntu-latest
    steps:
      - name: Test-Ausgabe
        run: echo "Simuliere Tests... alles OK."

  build-ready:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Bereit zum Bauen
        run: echo "✅ Alles bereit für Build oder Deployment."

